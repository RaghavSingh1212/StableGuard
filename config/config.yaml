# StableGuard configuration.
# Everything the generator, the tools, the env and the agents need to agree on
# lives here so a run is reproducible from one file.

dataset:
  stablecoins: ["USDC", "USDT"]
  chains: ["Solana", "Ethereum", "Base"]
  merchant_categories: ["ecommerce", "crypto_exchange", "gambling", "remittance", "payroll", "marketplace"]
  high_risk_categories: ["crypto_exchange", "gambling"]
  default_fraud_rate: 0.15
  default_seed: 42
  n_wallets: 400
  n_merchants: 60

env:
  # Maximum tool calls the agent may make before it must decide.
  tool_budget: 6
  # Reward shaping. Documented in stableguard/env.py.
  reward_correct: 1.0
  reward_wrong: -1.0
  reward_tool_call: -0.05
  reward_efficient_catch_bonus: 0.2
  efficient_catch_max_tools: 2

# Thresholds used by the rule-based baseline agent and by the risk scores the
# tools report. Tuning these is the cheapest way to move the baseline.
thresholds:
  velocity_flag: 10
  amount_ratio_flag: 8.0
  new_wallet_age_days: 7
  large_amount_usd: 5000.0
  merchant_risk_flag: 0.7

llm:
  # Overridable with the STABLEGUARD_CLAUDE_MODEL environment variable.
  model: "claude-opus-5-5"
  max_tokens: 2048
  effort: "low"
  # Per million tokens, used only to estimate the cost of an eval run.
  input_cost_per_mtok: 4.0
  output_cost_per_mtok: 20.0
